<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Equipment Services home">
      <img class="tapani-logo" src="images/logo.ico" alt="Tapani logo" />
      <span class="brand-title">Service Portal</span>
    </a>
    <nav class="header-actions" aria-label="Primary navigation">
      <button class="iconbtn" id="treeToggleBtn" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
    </nav>
  </header>

  <div class="overlay" id="overlay" hidden></div>

  <main class="main">
    <aside class="panel sidebar" id="sidebar" aria-labelledby="browseTitle">
      <div class="section-header">
        <div>
          <h1 class="panel-title" id="browseTitle">Browse</h1>
        </div>
        <div class="sidebar-header-actions">
          <button class="sidebar-action-btn" id="collapseTreeBtn" type="button">Refresh</button>
          <button class="iconbtn sidebar-close" id="sidebarCloseBtn" type="button" aria-label="Close sidebar">Close</button>
        </div>
      </div>
      <nav class="tree" id="tree" aria-label="Categories"></nav>
    </aside>

    <section class="panel content" aria-labelledby="mediaTitle">
      <h2 class="panel-title panel-title-spaced" id="mediaTitle">Media</h2>
      <div class="gallery" id="gallery"></div>
      <p class="small" id="imgHint"></p>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Media preview" hidden>
    <div class="frame">
      <img id="lightboxImg" alt="" />
      <video id="lightboxVideo" controls playsinline></video>
    </div>
    <p class="caption" id="lightboxCaption"></p>
  </div>

  <script type="module" src="user.js"></script>
</body>

</html>
