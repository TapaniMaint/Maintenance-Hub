<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipment Services</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <div class="brand">
      <img class="tapani-logo" src="images/logo.ico" alt="Tapani logo" />
      <b>Equipment Services</b>
    </div>
    <div class="row" style="gap:10px; justify-content:flex-end;">
      <button class="iconbtn" id="treeToggleBtn" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>

  <div class="main">
    <section class="panel sidebar" id="sidebar" aria-label="Category browser">
      <div class="row" style="justify-content: space-between;">
        <div>
          <div style="font-weight: 700;">Browse</div>
        </div>
        <div class="sidebar-header-actions">
          <button class="sidebar-action-btn" id="collapseTreeBtn" type="button">Refresh</button>
          <button class="iconbtn sidebar-close" id="sidebarCloseBtn" type="button" aria-label="Close sidebar">Close</button>
        </div>
      </div>
      <div class="tree" id="tree"></div>
    </section>
    <section class="panel content">
      <div style="font-weight: 700; margin-bottom: 8px;">Media</div>
      <div class="gallery" id="gallery"></div>
      <div class="small" id="imgHint"></div>
    </section>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="frame">
      <img id="lightboxImg" alt="" />
      <video id="lightboxVideo" controls playsinline></video>
    </div>
    <div class="caption" id="lightboxCaption"></div>
  </div>

  <div class="fab" id="pageFab">
    <div class="fab-menu" id="pageFabMenu">
      <a href="/index.html" id="fabUserLink">User Page</a>
    </div>
    <button class="fab-btn" id="pageFabBtn" type="button" aria-label="Pages">+</button>
  </div>
  <div class="fab-backdrop" id="pageFabBackdrop"></div>

  <script type="module" src="user.js"></script>
</body>

</html>
