<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Service Portal</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="styles.css?v=radius-rules-1-20260715" />
</head>

<body class="page page--login login-page">
  <header class="site-header app-header">
    <a class="brand app-brand" href="/" aria-label="Equipment Services home">
      <img class="tapani-logo app-brand__logo" src="images/logo.ico" alt="Tapani logo" />
      <span class="brand-title app-brand__title">Service Portal</span>
    </a>
    <nav class="header-actions app-header__actions" aria-label="Primary navigation">
      <div class="settings-menu settings">
        <button class="settings-toggle settings__toggle" id="settingsToggleBtn" type="button" aria-label="Settings"
          aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel">
          <svg class="setting-icon settings__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.73l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.73v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <div class="settings-panel settings__panel" id="settingsPanel" role="dialog" aria-labelledby="settingsTitle" hidden>
          <div class="settings-title settings__title" id="settingsTitle">Settings</div>
          <fieldset class="theme-options settings__options">
            <legend>Mode</legend>
            <label class="theme-option settings__option">
              <input type="radio" name="themeMode" value="dark" />
              <span>Dark</span>
            </label>
            <label class="theme-option settings__option">
              <input type="radio" name="themeMode" value="light" />
              <span>Light</span>
            </label>
            <label class="theme-option settings__option">
              <input type="radio" name="themeMode" value="forest" />
              <span>Forest</span>
            </label>
            <label class="theme-option settings__option">
              <input type="radio" name="themeMode" value="steel" />
              <span>Steel</span>
            </label>
          </fieldset>
        </div>
      </div>
    </nav>
  </header>

  <main class="login-main login">
    <section class="panel auth-shell login-shell auth-card-shell" aria-labelledby="loginTitle">
      <div class="auth-card auth-card__inner">
        <div class="auth-copy auth-card__copy">
          <h1 id="loginTitle">User Login</h1>
          <p class="small">Sign in with your Service Portal account.</p>
        </div>

        <form class="auth-form auth-card__form" id="authForm">
          <label class="sr-only" for="userEmail">Email</label>
          <input id="userEmail" type="email" autocomplete="username" placeholder="Email" required />

          <label class="sr-only" for="userPassword">Password</label>
          <input id="userPassword" type="password" autocomplete="current-password" placeholder="Password" minlength="6"
            required />

          <div class="row auth-card__actions">
            <button id="authSubmitBtn" type="submit">Sign in</button>
          </div>
        </form>
        <div class="status-banner auth-card__status" id="statusBanner" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="vendor/supabase.js"></script>
  <script type="module" src="login.js"></script>
</body>

</html>
