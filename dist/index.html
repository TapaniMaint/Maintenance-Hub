<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Equipment Services</title>
  <script type="module" crossorigin src="/assets/index-xTea8JDy.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DT_HIN5m.css">
</head>

<body>
  <header>
    <div class="brand">
      <img class="tapani-logo" src="/assets/logo-BpeiXKze.ico" alt="Tapani logo" />
      <b>Equipment Services</b>
    </div>
    <div class="row" style="gap:10px; justify-content:flex-end;">
      <button class="iconbtn" id="treeToggleBtn" type="button">Menu</button>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>

  <div class="main">
    <section class="panel sidebar">
      <div class="row" style="justify-content: space-between;">
        <div>
          <div style="font-weight: 700;">Browse</div>
          <div class="small">Click a row to expand/collapse.</div>
        </div>
        <div class="sidebar-header-actions">
          <button class="iconbtn sidebar-close" id="sidebarCloseBtn" type="button" aria-label="Close sidebar">Close</button>
        </div>
      </div>
      <div class="tree" id="tree"></div>
    </section>
    <section class="panel content">
      <div class="panel" style="background: var(--panel2);">
        <div style="font-weight: 700; margin-bottom: 8px;">Images</div>
        <div class="gallery" id="gallery"></div>
        <div class="small" id="imgHint"></div>
      </div>
    </section>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="frame">
      <img id="lightboxImg" alt="" />
    </div>
    <div class="caption" id="lightboxCaption"></div>
  </div>

  <style>
    .lightbox,
    .lightbox .frame,
    .lightbox img {
      touch-action: none;
    }

    .lightbox img {
      transform-origin: center center;
    }
  </style>
  <script>
    (() => {
      const img = document.getElementById("lightboxImg");
      const lightbox = document.getElementById("lightbox");
      if (!img || !lightbox) return;

      let zoom = 1;
      let panX = 0;
      let panY = 0;
      let drag = null;
      let pinch = null;
      const pointers = new Map();

      const apply = () => {
        img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      };

      const reset = () => {
        zoom = 1;
        panX = 0;
        panY = 0;
        drag = null;
        pinch = null;
        pointers.clear();
        apply();
      };

      const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const center = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

      img.addEventListener("click", (event) => event.stopPropagation());
      img.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        img.setPointerCapture?.(event.pointerId);
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (pointers.size === 1 && zoom > 1) {
          event.preventDefault();
          drag = { x: event.clientX, y: event.clientY, panX, panY };
        }
        if (pointers.size >= 2) {
          event.preventDefault();
          const points = [...pointers.values()];
          const midpoint = center(points[0], points[1]);
          pinch = { distance: distance(points[0], points[1]), zoom, x: midpoint.x, y: midpoint.y, panX, panY };
          drag = null;
        }
      });

      img.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId)) return;
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (pointers.size >= 2 && pinch) {
          event.preventDefault();
          if (pinch.distance < 1) return;
          const points = [...pointers.values()];
          const midpoint = center(points[0], points[1]);
          zoom = Math.min(4, Math.max(1, pinch.zoom * (distance(points[0], points[1]) / pinch.distance)));
          panX = zoom === 1 ? 0 : pinch.panX + midpoint.x - pinch.x;
          panY = zoom === 1 ? 0 : pinch.panY + midpoint.y - pinch.y;
          apply();
          return;
        }
        if (!drag) return;
        event.preventDefault();
        panX = drag.panX + event.clientX - drag.x;
        panY = drag.panY + event.clientY - drag.y;
        apply();
      });

      const end = (event) => {
        pointers.delete(event.pointerId);
        pinch = null;
        drag = null;
      };
      img.addEventListener("pointerup", end);
      img.addEventListener("pointercancel", end);

      new MutationObserver(() => {
        if (!lightbox.classList.contains("open")) reset();
      }).observe(lightbox, { attributes: true, attributeFilter: ["class"] });
    })();
  </script>

</body>

</html>
